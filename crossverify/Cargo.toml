[package]
name = "libveritas_crossverify"
version = "0.1.0"
description = "Cross-platform account verification for Spaces handles: claims, per-platform checks and notary proofs, with optional I/O"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Performs the requests itself (reqwest + WebSockets), for the CLI and
# servers. Off by default: wasm and mobile builds bring their own fetch.
fetch = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures"]

[dependencies]
base64 = "0.22"
bitcoin = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "verify"
required-features = ["fetch"]
